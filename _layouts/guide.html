<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.seo_title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <meta name="author" content="Samet Tenekeci">

    <link rel="canonical" href="{{ page.canonical_url }}">
    <link rel="alternate" hreflang="en" href="https://smtnkc.github.io/digital-entrepreneurship-guide/">
    <link rel="alternate" hreflang="tr" href="https://smtnkc.github.io/dijital-girisimcilik-rehberi/">
    <link rel="alternate" hreflang="x-default" href="https://smtnkc.github.io/digital-entrepreneurship-guide/">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Samet Tenekeci">
    <meta property="og:locale" content="{{ page.og_locale }}">
    <meta property="og:title" content="{{ page.seo_title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:url" content="{{ page.canonical_url }}">

    <link rel="icon" href="{{ '/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/controls.css' | relative_url }}?v=3">
    <link rel="stylesheet" href="{{ '/assets/guide.css' | relative_url }}?v=4">
    <script src="{{ '/assets/theme.js' | relative_url }}?v=2"></script>
  </head>
  <body>
    <a class="skip-link" href="#guide-content">{{ page.skip_label }}</a>

    <header class="guide-header">
      <div class="guide-header__inner">
        <a class="home-link" href="{{ '/' | relative_url }}" aria-label="{{ page.home_label }}">
          <span aria-hidden="true">&larr;</span> smtnkc.github.io
        </a>

        <div class="site-controls">
          <button class="control-toggle theme-toggle" type="button" data-theme-toggle
            data-label-dark="{% if page.lang == 'tr' %}Koyu modu kullan{% else %}Use dark mode{% endif %}"
            data-label-light="{% if page.lang == 'tr' %}Açık modu kullan{% else %}Use light mode{% endif %}"
            aria-label="{% if page.lang == 'tr' %}Koyu modu kullan{% else %}Use dark mode{% endif %}"
            aria-pressed="false">
            <span class="control-toggle__segment theme-toggle__light" aria-hidden="true">☀</span>
            <span class="control-toggle__segment theme-toggle__dark" aria-hidden="true">☾</span>
            <span class="control-sr-only">{% if page.lang == 'tr' %}Renk temasını değiştir{% else %}Change color theme{% endif %}</span>
          </button>

          <nav class="control-toggle language-toggle" aria-label="{{ page.language_label }}">
            {% if page.lang == 'tr' %}
              <span class="control-toggle__segment control-toggle__segment--flag" lang="tr" aria-current="page"
                title="Türkçe"><img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/tr.svg" width="20" height="20" alt=""><span class="control-sr-only">Türkçe</span></span>
            {% else %}
              <a class="control-toggle__segment control-toggle__segment--flag"
                href="{{ '/dijital-girisimcilik-rehberi/' | relative_url }}" hreflang="tr" lang="tr"
                title="Türkçe"><img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/tr.svg" width="20" height="20" alt=""><span class="control-sr-only">Türkçe</span></a>
            {% endif %}

            {% if page.lang == 'en' %}
              <span class="control-toggle__segment control-toggle__segment--flag" lang="en" aria-current="page"
                title="English"><img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/gb.svg" width="20" height="20" alt=""><span class="control-sr-only">English</span></span>
            {% else %}
              <a class="control-toggle__segment control-toggle__segment--flag"
                href="{{ '/digital-entrepreneurship-guide/' | relative_url }}" hreflang="en" lang="en"
                title="English"><img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/gb.svg" width="20" height="20" alt=""><span class="control-sr-only">English</span></a>
            {% endif %}
          </nav>
        </div>
      </div>
    </header>

    <main class="guide-shell">
      <aside class="guide-sidebar" aria-label="{{ page.toc_label }}">
        <nav class="guide-toc">
          <p class="guide-toc__title">{{ page.toc_label }}</p>
          <ol data-guide-toc></ol>
        </nav>
      </aside>

      <div class="guide-main">
        <details class="guide-toc-mobile">
          <summary>{{ page.toc_label }}</summary>
          <nav aria-label="{{ page.toc_label }}">
            <ol data-guide-toc></ol>
          </nav>
        </details>

        <article class="guide-content" id="guide-content">
          {{ content }}
        </article>

        <footer class="guide-footer">
          <a href="{{ '/' | relative_url }}">&larr; {{ page.footer_label }}</a>
        </footer>
      </div>
    </main>

    <script>
      (() => {
        const headings = Array.from(document.querySelectorAll('.guide-content h2'))
          .filter((heading) => /^(?:[1-9]|10)\.\s/.test(heading.textContent.trim()))
          .slice(0, 10);

        const slugify = (text) => text
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');

        headings.forEach((heading) => {
          if (!heading.id) heading.id = slugify(heading.textContent);
        });

        document.querySelectorAll('[data-guide-toc]').forEach((list) => {
          headings.forEach((heading) => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = `#${heading.id}`;
            link.textContent = heading.textContent;
            item.appendChild(link);
            list.appendChild(item);
          });
        });

        document.querySelectorAll('.guide-toc-mobile a').forEach((link) => {
          link.addEventListener('click', () => link.closest('details').removeAttribute('open'));
        });
      })();
    </script>
  </body>
</html>
