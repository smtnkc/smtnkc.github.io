<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.seo_title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="Samet Tenekeci">

  <link rel="canonical" href="{{ page.canonical_url }}">
  <link rel="alternate" hreflang="en" href="https://smtnkc.github.io/digital-entrepreneurship-guide/">
  <link rel="alternate" hreflang="tr" href="https://smtnkc.github.io/dijital-girisimcilik-rehberi/">
  <link rel="alternate" hreflang="x-default" href="https://smtnkc.github.io/digital-entrepreneurship-guide/">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Samet Tenekeci">
  <meta property="og:locale" content="{{ page.og_locale }}">
  <meta property="og:title" content="{{ page.seo_title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.canonical_url }}">

  <link rel="icon" href="{{ '/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/controls.css' | relative_url }}?v=8">
    <link rel="stylesheet" href="{{ '/assets/guide.css' | relative_url }}?v=10">
  <script src="{{ '/assets/theme.js' | relative_url }}?v=5"></script>
</head>

<body>

  <header class="guide-header">
    <div class="guide-header__inner">
      <div class="site-controls">
        <button class="control-toggle theme-toggle" type="button" data-theme-toggle
          data-label-dark="{% if page.lang == 'tr' %}Koyu modu kullan{% else %}Use dark mode{% endif %}"
          data-label-light="{% if page.lang == 'tr' %}Açık modu kullan{% else %}Use light mode{% endif %}"
          aria-label="{% if page.lang == 'tr' %}Koyu modu kullan{% else %}Use dark mode{% endif %}"
          aria-pressed="false">
          <span class="control-toggle__segment theme-toggle__light" aria-hidden="true">☀</span>
          <span class="control-toggle__segment theme-toggle__dark" aria-hidden="true">☾</span>
          <span class="control-sr-only">{% if page.lang == 'tr' %}Renk temasını değiştir{% else %}Change color theme{%
            endif %}</span>
        </button>

        <a class="control-toggle language-toggle" {% if page.lang=='tr' %}
          href="{{ '/digital-entrepreneurship-guide/' | relative_url }}" hreflang="en" aria-label="Switch to English"
          title="Switch to English" {% else %} href="{{ '/dijital-girisimcilik-rehberi/' | relative_url }}"
          hreflang="tr" aria-label="Türkçeye geç" title="Türkçeye geç" {% endif %}>
          <span class="control-toggle__segment control-toggle__segment--flag" lang="tr" {% if page.lang=='tr'
            %}aria-current="page" {% endif %}>
            <img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/tr.svg" width="20"
              height="20" alt="">
            <span class="control-sr-only">Türkçe</span>
          </span>
          <span class="control-toggle__segment control-toggle__segment--flag" lang="en" {% if page.lang=='en'
            %}aria-current="page" {% endif %}>
            <img class="control-toggle__flag" src="https://hatscripts.github.io/circle-flags/flags/gb.svg" width="20"
              height="20" alt="">
            <span class="control-sr-only">English</span>
          </span>
        </a>

        <details class="guide-menu">
          <summary class="guide-menu__toggle"
            aria-label="{% if page.lang == 'tr' %}Bölüm menüsünü aç{% else %}Open section menu{% endif %}"
            title="{% if page.lang == 'tr' %}Bölüm menüsü{% else %}Section menu{% endif %}">
            <span class="guide-menu__icon" aria-hidden="true"><span></span><span></span><span></span></span>
          </summary>
          <nav class="guide-menu__panel" aria-label="{{ page.toc_label }}">
            <p class="guide-menu__title">{{ page.toc_label }}</p>
            <ol data-guide-toc></ol>
          </nav>
        </details>
      </div>
    </div>
  </header>

  <main class="guide-shell">
    <aside class="guide-sidebar" aria-label="{{ page.toc_label }}">
      <nav class="guide-toc">
        <p class="guide-toc__title">{{ page.toc_label }}</p>
        <ol data-guide-toc></ol>
      </nav>
    </aside>

    <div class="guide-main">
      <article class="guide-content" id="guide-content">
        {{ content }}
      </article>

      <!--<footer class="guide-footer">
          <a href="{{ '/' | relative_url }}">&larr; {{ page.footer_label }}</a>
        </footer>-->
    </div>
  </main>

  <script src="{{ '/assets/guide.js' | relative_url }}?v=3"></script>
</body>

</html>
